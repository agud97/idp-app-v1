apiVersion: batch/v1
kind: CronJob
metadata:
  name: popeye
  namespace: kb-system
spec:
  schedule: "*/30 * * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: popeye
        spec:
          serviceAccountName: popeye
          restartPolicy: OnFailure
          initContainers:
            - name: popeye
              image: derailed/popeye:v0.21.1
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  popeye -o json > /tmp/report.json || true
                  echo "Popeye done: $(wc -c < /tmp/report.json) bytes"
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          containers:
            - name: uploader
              image: minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1
              envFrom:
                - configMapRef:
                    name: kb-stack-config
              env:
                - name: MINIO_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-credentials
                      key: accessKey
                - name: MINIO_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-credentials
                      key: secretKey
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  ts=$(date -u +"%Y%m%dT%H%M%SZ")
                  mc alias set local "$MINIO_ENDPOINT" "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"
                  mc mb -p "local/kb-artifacts" || true
                  mc cp "/tmp/report.json" "local/kb-artifacts/raw/popeye/${CLUSTER_ID}/${ts}/report.json"
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
