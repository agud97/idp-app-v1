apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: open-webui
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://helm.openwebui.com
    chart: open-webui
    targetRevision: "5.18.0"
    helm:
      values: |
        ollama:
          enabled: false
        openaiBaseApiUrls:
          - http://llm-proxy.llm-proxy.svc.cluster.local:8080/v1
        extraEnvVars:
          - name: OPENAI_API_KEY
            value: "not-needed"
          - name: VECTOR_DB
            value: "qdrant"
          - name: QDRANT_URI
            value: "http://qdrant.qdrant.svc.cluster.local:6333"
          - name: RAG_EMBEDDING_ENGINE
            value: ""
          - name: RAG_EMBEDDING_MODEL
            value: "sentence-transformers/all-MiniLM-L6-v2"
          - name: ENABLE_OAUTH_SIGNUP
            value: "true"
          - name: OAUTH_PROVIDER_NAME
            value: "Authentik"
          - name: OPENID_PROVIDER_URL
            value: "http://authentik-server.authentik.svc.cluster.local:9000/application/o/openwebui/"
          - name: OAUTH_CLIENT_ID
            value: "openwebui"
          - name: OAUTH_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: open-webui-sso
                key: OAUTH_CLIENT_SECRET
          - name: OAUTH_ROLES_CLAIM
            value: "groups"
          - name: OAUTH_ADMIN_ROLES
            value: "prod_runityai_admin"
          - name: OAUTH_ALLOWED_ROLES
            value: "prod_runityai_admin,prod_runityai_user"
          - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
            value: "true"
        persistence:
          enabled: true
          size: 5Gi
          storageClass: openebs-hostpath
  destination:
    server: https://kubernetes.default.svc
    namespace: open-webui
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
